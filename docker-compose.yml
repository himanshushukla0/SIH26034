services:
  db:
    image: postgres:16-alpine
    container_name: sih_lmpc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lmpc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lmpc_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-lmpc_compliance_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lmpc_admin} -d ${POSTGRES_DB:-lmpc_compliance_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sih_lmpc_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-lmpc_admin}:${POSTGRES_PASSWORD:-lmpc_secure_2026}@db:5432/${POSTGRES_DB:-lmpc_compliance_db}
      - GEMINI_MODEL=gemini-3.6-flash
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sih_lmpc_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_uploads:
    driver: local
  postgres_data:
    driver: local
